version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cloud-backup-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudbackup}
      POSTGRES_USER: ${DB_USER:-cloudbackup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbackup123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudbackup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-backup-network
    restart: unless-stopped

  # Spring Boot Application
  cloud-backup-app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: cloud-backup-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cloudbackup}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cloudbackup}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cloudbackup123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_CLOUDBACKUP: ${LOGGING_LEVEL_COM_CLOUDBACKUP:-DEBUG}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    volumes:
      - ../logs:/app/logs
      # Uncomment to mount source for live reloading during development
      # - ..:/app/src
      # - /app/target
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cloud-backup-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: cloud-backup-nginx
    depends_on:
      - cloud-backup-app
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - cloud-backup-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  cloud-backup-network:
    driver: bridge

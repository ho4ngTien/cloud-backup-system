<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CloudSafe – Restore thành công</title>
    <style>
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f5f7fa; margin:0; padding:0; }
        .container { max-width:580px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .header { background:linear-gradient(135deg,#1a73e8,#0d47a1); padding:36px 40px; text-align:center; }
        .header h1 { color:#fff; margin:0; font-size:22px; }
        .badge { display:inline-block; background:#34a853; color:#fff; padding:6px 18px; border-radius:20px; font-size:13px; font-weight:600; margin:24px 40px 0; }
        .body { padding:32px 40px; }
        .info-box { background:#e8f5e9; border-left:4px solid #34a853; border-radius:8px; padding:16px 20px; font-size:14px; color:#1b5e20; margin:16px 0; }
        .footer { background:#f8f9fa; padding:20px 40px; text-align:center; font-size:12px; color:#9aa0a6; border-top:1px solid #e8eaed; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>☁️ CloudSafe</h1>
    </div>
    <div style="padding:0 40px;"><span class="badge">✅ Restore thành công</span></div>
    <div class="body">
        <p>Xin chào <strong th:text="${displayName}">User</strong>,</p>
        <p style="color:#5f6368; font-size:14px; line-height:1.6;">
            Dữ liệu của bạn đã được khôi phục thành công về thiết bị.
        </p>
        <div class="info-box">
            <b>Restore ID:</b> <span th:text="${restoreId}">–</span><br/>
            <b>Thư mục đích:</b> <span th:text="${targetPath}">–</span><br/>
            <b>Hoàn thành lúc:</b> <span th:text="${completedAt}">–</span>
        </div>
    </div>
    <div class="footer"><p>© 2024 CloudSafe. Email tự động.</p></div>
</div>
</body>
</html>

name: CloudSafe CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: cloudsafe-backend
  GCR_HOSTNAME: gcr.io
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # =====================================================
  # Job 1: Build & Test
  # =====================================================
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudbackup_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build server (skip tests for speed on PR)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Run unit tests
        run: mvn -B test --file pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cloudbackup_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          APP_JWT_SECRET: TestSecretKeyForCICD256BitsMinimumLength
          APP_STORAGE_GCP_BUCKET_NAME: test-bucket

      - name: Build CLI fat JAR
        run: mvn -B package --file cli/pom.xml

      - name: Upload server JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudsafe-server-jar
          path: target/*.jar
          retention-days: 7

      - name: Upload CLI fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: cloudsafe-cli-jar
          path: cli/target/cloudsafe.jar
          retention-days: 30

  # =====================================================
  # Job 2: Docker Build & Push (main branch only)
  # =====================================================
  docker-build-push:
    name: Docker Build & Push to GCR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set image tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f infrastructure/Dockerfile \
            -t ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHA_SHORT }} \
            -t ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push to Google Container Registry
        run: |
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHA_SHORT }}
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

  # =====================================================
  # Job 3: Deploy to Google Compute Engine
  # =====================================================
  deploy-to-gce:
    name: Deploy to GCE via SSH
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCE instance
        run: |
          gcloud compute ssh ${{ secrets.GCE_INSTANCE_NAME }} \
            --zone=${{ secrets.GCE_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="
              # Pull latest image
              docker pull ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

              # Stop old container
              docker stop cloudsafe-app 2>/dev/null || true
              docker rm   cloudsafe-app 2>/dev/null || true

              # Start new container
              docker run -d \
                --name cloudsafe-app \
                --restart unless-stopped \
                -p 8080:8080 \
                -e DB_HOST=\$DB_HOST \
                -e DB_NAME=\$DB_NAME \
                -e DB_USER=\$DB_USER \
                -e DB_PASSWORD=\$DB_PASSWORD \
                -e JWT_SECRET=\$JWT_SECRET \
                -e GCP_BUCKET_NAME=\$GCP_BUCKET_NAME \
                -e MAIL_USERNAME=\$MAIL_USERNAME \
                -e MAIL_PASSWORD=\$MAIL_PASSWORD \
                -e SPRING_PROFILES_ACTIVE=docker \
                ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

              echo '✅ Deployment complete!'
              docker ps --filter name=cloudsafe-app
            "

      - name: Health check
        run: |
          sleep 20
          gcloud compute ssh ${{ secrets.GCE_INSTANCE_NAME }} \
            --zone=${{ secrets.GCE_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --command="curl -sf http://localhost:8080/actuator/health | python3 -m json.tool"
